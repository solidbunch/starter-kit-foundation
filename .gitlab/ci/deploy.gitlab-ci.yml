# Reusable deploy job templates — GitLab analog of .github/workflows/job-deploy.yml
#
# ONLY hidden (leading-dot) job templates live here, fully parameterized by variables — zero
# environment-specific values. Hidden jobs are never added to a pipeline on their own, so this
# file is included unconditionally by .gitlab-ci.yml; the concrete jobs that extend these
# templates live in deploy-dev.gitlab-ci.yml / deploy-prod.gitlab-ci.yml, each included only for
# its own branch — see .claude/rules/gitlab-ci.md for the full design.
#
# The shared build/deploy logic (conditional Composer steps, SSH setup, deploy-target resolution,
# rsync + remote make chain) lives in sh/ci/*.sh — shared verbatim with the GitHub Actions side
# (job-deploy.yml, see .claude/rules/ci.md). See sh/ci/composer-extras.sh, sh/ci/setup-ssh.sh, and
# sh/ci/deploy.sh (which sources sh/ci/resolve-deploy-target.sh) for the exact behavior and CLI/env
# contracts of each step below.

.build-composer:
  stage: build
  image:
    name: "$APP_COMPOSER_IMAGE"
    entrypoint: [""]
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
  script:
    - (cd config/environment && sh "$CI_PROJECT_DIR/sh/env/pass_gen.sh")
    - bash ./sh/env/init.sh "$ENVIRONMENT_TYPE"
    - source ./.env
    - composer install-${APP_BUILD_MODE}
    - cd "web/wp-content/themes/${WP_DEFAULT_THEME}" && composer install-${APP_BUILD_MODE}
    - cd "$CI_PROJECT_DIR"
    - sh ./sh/ci/composer-extras.sh "$ENVIRONMENT_TYPE" "$IS_DEMO"
  artifacts:
    expire_in: 1 hour
    paths:
      - vendor/
      - web/wp-core/
      - web/wp-content/plugins/
      - web/wp-content/mu-plugins/
      - web/wp-content/themes/${WP_DEFAULT_THEME}/vendor/
      - kit-modules/

.build-node:
  stage: build
  image:
    name: "$APP_NODE_IMAGE"
    entrypoint: [""]
  script:
    - (cd config/environment && sh "$CI_PROJECT_DIR/sh/env/pass_gen.sh")
    - bash ./sh/env/init.sh "$ENVIRONMENT_TYPE"
    - source ./.env
    - npm run install-${APP_BUILD_MODE} --prefix "web/wp-content/themes/${WP_DEFAULT_THEME}"
  artifacts:
    expire_in: 1 hour
    paths:
      - web/wp-content/themes/${WP_DEFAULT_THEME}/assets/build/
      - web/wp-content/themes/${WP_DEFAULT_THEME}/blocks/
      - web/wp-content/themes/${WP_DEFAULT_THEME}/mix-manifest.json
    exclude:
      - web/wp-content/themes/${WP_DEFAULT_THEME}/node_modules/**

.deploy:
  stage: deploy
  image: alpine:3.20
  resource_group: $ENVIRONMENT_TYPE
  needs:
    - build-composer
    - build-node
  before_script:
    - apk add --no-cache openssh-client rsync
    - SSH_INPUT_MODE=file sh ./sh/ci/setup-ssh.sh
  script:
    - sh ./sh/ci/deploy.sh "$ENVIRONMENT_TYPE"
  after_script:
    - rm -f ~/.ssh/id_rsa ~/.ssh/config
