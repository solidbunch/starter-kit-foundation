# Dev-environment jobs — GitLab analog of .github/workflows/workflow-deploy-develop.yml
#
# This file is only ever included when the pipeline's ref is `develop` (see the `rules:` on its
# `include:` entry in .gitlab-ci.yml) — that gate is what makes the plain, unsuffixed job names
# and the top-level `variables:` below safe. If this file and deploy-prod.gitlab-ci.yml were ever
# included unconditionally at the same time, GitLab would deep-merge both `variables:` blocks
# (last include wins) and both `build-composer`/`build-node` job pairs would collide — do not
# remove the include-level `rules:` without re-checking .claude/rules/gitlab-ci.md.

variables:
  ENVIRONMENT_TYPE: dev
  DEPLOY_SSH_HOST: develop.starter-kit.io
  DEPLOY_PATH: /srv/develop.starter-kit.io

build-composer:
  extends: .build-composer

build-node:
  extends: .build-node

deploy-dev:
  extends: .deploy
  environment:
    name: dev
    url: http://develop.starter-kit.io
