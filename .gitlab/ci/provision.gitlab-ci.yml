# GitLab analog of .github/workflows/job-provision.yml's guard surface + build phase.
# No top-level `variables:` block here by design — see .claude/rules/gitlab-ci.md's "bug this
# design avoids" note (top-level variables: from multiple included files deep-merge, last include
# wins). PIPELINE_KIND and APP_* images/IS_DEMO reach every job via the root .gitlab-ci.yml's own
# top-level variables:/project CI/CD variables. ENVIRONMENT_TYPE/ACTION_TYPE/SKIP_ANSIBLE/
# PLAN_JOB_ID/CONFIRM_DESTROY/CONFIRM are DELIBERATELY mapped per-job below ($[[ inputs.x ]] in
# each job's own variables: block), not at this file's top level — an earlier attempt to map
# ENVIRONMENT_TYPE at the ROOT file's top level collided with deploy-dev/deploy-prod's own
# top-level ENVIRONMENT_TYPE and silently broke prod deploys (root always wins that collision,
# confirmed by live gitlab-ci-local testing). Job-level variables: never collides with a
# different file's top-level variables:, since it's a different job entirely.
#
# `provision` runs entirely native (IAC_NATIVE: "1", image: $APP_IAC_IMAGE) — this job's container
# IS the toolchain, there is no Docker daemon to shell out to on a plain GitLab.com shared runner.
# Pinned-plan retrieval — see `before_script:` step 5.5 below (it runs before the AWS OIDC
# exchange, since it needs no AWS credentials). The pre-destroy state backup — see the `script:`
# block below, between the 'shared' step and the environment-layer step: on ACTION_TYPE=destroy it
# runs `terraform.sh -c state-pull` into `tfstate-backup.json`, aborts the destroy if that file is
# empty, and GPG-encrypts it (same TFPLAN_PASSPHRASE gate as the pinned-plan flow) before the
# environment-layer `terraform.sh -c destroy` call runs.
#
# Pinned-plan flow mirrors job-provision.yml's TFPLAN_PASSPHRASE-gated GPG
# encrypt/decrypt with one platform-forced difference: GitHub pins a *run* (`PLAN_RUN_ID` +
# `actions/download-artifact`), GitLab has no Free-tier equivalent (`needs:artifacts` is
# same-pipeline only, `needs:project` is Premium+ and only ever latest-successful) — the only
# mechanism that pins an exact earlier job is the Job Artifacts API by **job ID**
# (`GET $CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/<id>/artifacts`), so the input here is
# `PLAN_JOB_ID`, a GitLab job ID, not a run/pipeline ID. Auth tries `JOB-TOKEN: $CI_JOB_TOKEN`
# first (`CI_JOB_TOKEN`'s access to this specific endpoint is tier-ambiguous in GitLab's own
# docs), falling back to `PRIVATE-TOKEN: $PLAN_ARTIFACT_TOKEN` (optional CI/CD variable, a
# project access token) when that variable is set and the first attempt didn't return HTTP 200.
# An explicit PLAN_JOB_ID that cannot be retrieved/unpacked/decrypted FAILS THE JOB — it never
# silently falls back to a fresh plan-then-apply; that fallback only happens when PLAN_JOB_ID is
# empty to begin with.
#
# `needs:` carries artifacts only, never CI/CD variables or shell state — every guard this job
# depends on (stage/env guard, region, CONFIRM_DESTROY) is re-run here from scratch, not trusted
# from `validate-provision-inputs` (which runs in its own fresh container). See
# .claude/rules/gitlab-ci.md for why pipeline inputs (ENVIRONMENT_TYPE, ACTION_TYPE,
# CONFIRM_DESTROY, SKIP_ANSIBLE, PLAN_JOB_ID, CONFIRM) are referenced here as bare `$VAR`s, the
# same pattern `validate-provision-inputs`/`build-basis` above already use.
#
# --------------------------------------------------------------------------------------------
# Job split (provision / provision-ansible / provision-dns) — see the plan's Architecture notes
# §8/§8a for the full reasoning; summarized here for anyone reading this file cold:
#
# - `.provision-base` (hidden, below) holds everything the three real jobs share: image,
#   variables, id_tokens, resource_group, environment, and the ENTIRE before_script guard chain
#   (stage/env guard, region, destroy confirmation, .env prep incl. the CLOUDFLARE_API_TOKEN
#   secret-clobber-trap fix — see the plan's §10 — has_basis check, TFPLAN_PASSPHRASE/pinned-plan
#   retrieval, OIDC/STS exchange, SSH setup, SSH pubkey extraction, state-backend bucket guard).
#   Duplicating the whole preamble into every job (rather than trying to share state across jobs)
#   is deliberate — GitLab job-to-job state never persists outside declared artifacts, exactly the
#   same constraint that forced GitHub's composite-action extraction (job-provision.yml).
# - `provision` (stage `provision`) does Terraform only (shared -> environment layer) and writes
#   `dns.env` (INSTANCE_IPV4/INSTANCE_IPV6, always both keys present) as a `reports: dotenv`
#   artifact — the single Terragrunt-output read in this file, consumed by `provision-dns` via
#   `needs:` instead of a second read.
# - `provision-ansible` / `provision-dns` (stage `provision-follow`, both `needs: [build-basis,
#   provision]`) carry the Ansible block and the `dns.sh` call respectively.
# - All three jobs share the SAME `resource_group: provision-$ENVIRONMENT_TYPE` (inherited from
#   `.provision-base`) — deliberately NOT split per job kind. A per-kind split was considered and
#   rejected: it would only serialize each kind against itself, letting a second dispatch's
#   Terraform start while the first dispatch's Ansible/DNS work is still running against the same
#   instance. The safety property this preserves — a second dispatch's `provision` cannot start
#   until the first dispatch's entire chain (`provision` + `provision-ansible` + `provision-dns`)
#   has drained — depends on the resource group's process mode being set to `oldest_first` via the
#   GitLab API (`PUT /projects/:id/resource_groups/provision-<env>`, no `.gitlab-ci.yml`/UI
#   surface for this — see the Manual gate in the plan and .claude/rules/gitlab-ci.md). Until that
#   API call is made per environment, this group runs in GitLab's default `unordered` mode and the
#   whole-chain exclusion guarantee does NOT hold. Do not reintroduce per-kind resource groups.
# - Each of the three jobs writes and `cat`s its OWN `provision-summary.md` — there is no
#   aggregating "summary" job on GitLab (unlike GitHub's `summary` job): GitLab has no
#   `$GITHUB_STEP_SUMMARY` equivalent, and a fourth job would need `when: always` plus cross-job
#   artifact plumbing for no user-visible gain beyond another log blob. This is a deliberate,
#   recorded asymmetry between the two platforms, not an oversight.
# --------------------------------------------------------------------------------------------

validate-provision-inputs:
  stage: validate
  image: alpine:3.20
  rules:
    - if: '$PIPELINE_KIND == "provision"'
  variables:
    ENVIRONMENT_TYPE: $[[ inputs.ENVIRONMENT_TYPE ]]
    ACTION_TYPE: $[[ inputs.ACTION_TYPE ]]
    CONFIRM_DESTROY: $[[ inputs.CONFIRM_DESTROY ]]
  script:
    # Fail fast on 'stage' (Terraform config exists, but ansible/inventory.yml has no stage
    # host yet — a documented gap, see kit-modules/basis/CLAUDE.md) before wasting any
    # AWS/SSH/composer setup time. Mirrors job-provision.yml's
    # "Validate ENVIRONMENT_TYPE has a Terraform environment" step.
    - |
      case "$ENVIRONMENT_TYPE" in
        dev|prod) ;;
        *)
          echo "Error: ENVIRONMENT_TYPE '$ENVIRONMENT_TYPE' is not supported by this pipeline yet — 'stage' has a Terraform environment (kit-modules/basis/terraform/envs/stage) but no Ansible host wired up (ansible/inventory.yml), so provisioning would create an EC2 instance Ansible cannot then configure. Only 'dev' and 'prod' are currently supported." >&2
          exit 1
          ;;
      esac
    - REGION="$(sh ./sh/ci/extract-aws-region.sh)"
    - 'echo "AWS region: $REGION"'
    # Only applies when ACTION_TYPE == destroy — no-op for plan/apply. Must run before any
    # AWS/credential step so a missing/mismatched confirmation never gets far enough to touch
    # cloud state. The operator must type the exact ENVIRONMENT_TYPE value to confirm intent.
    - |
      if [ "$ACTION_TYPE" = "destroy" ]; then
        sh ./sh/ci/confirm-match.sh "$ENVIRONMENT_TYPE" "$CONFIRM_DESTROY" "CONFIRM_DESTROY"
      fi

build-basis:
  stage: build
  image:
    name: $APP_COMPOSER_IMAGE
    entrypoint: ['']
  # Also gated in for PIPELINE_KIND=="bootstrap-state" — bootstrap-state.gitlab-ci.yml's
  # `bootstrap-state` job needs: this job's kit-modules/ artifact (see that file's own comment) for
  # the same reason `provision` below does: kit-modules/basis is git-ignored, so a real GitLab.com
  # shared runner's tracked-files-only clone never has it without this artifact.
  rules:
    - if: '$PIPELINE_KIND == "provision"'
    - if: '$PIPELINE_KIND == "bootstrap-state"'
  needs:
    # optional: true — validate-provision-inputs is NOT part of a bootstrap-state pipeline (its
    # guards are provisioning-specific: stage-gap, region, CONFIRM_DESTROY); bootstrap-state has
    # its own independent CONFIRM-region guard in its own job. Without optional: true, GitLab
    # would refuse to create a bootstrap-state pipeline at all, since build-basis would `needs:` a
    # job that never exists in it.
    - job: validate-provision-inputs
      optional: true
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
    ENVIRONMENT_TYPE: $[[ inputs.ENVIRONMENT_TYPE ]]
  script:
    - (cd config/environment && sh "$CI_PROJECT_DIR/sh/env/pass_gen.sh")
    - bash ./sh/env/init.sh "$ENVIRONMENT_TYPE"
    - source ./.env
    - composer install-${APP_BUILD_MODE}
    - |
      if [ "$IS_DEMO" = "true" ]; then
        echo "Detected demo mode — forcing Composer update from dist"
        composer update solidbunch/basis --no-interaction --with-all-dependencies
      else
        echo "Skipping composer update — not in demo mode"
      fi
  artifacts:
    expire_in: 1 hour
    paths:
      - vendor/
      - kit-modules/
      - composer.lock

# --------------------------------------------------------------------------------------------
# Hidden base job — shared image/variables/id_tokens/resource_group/environment/before_script
# for provision / provision-ansible / provision-dns. See the file header comment above for the
# reasoning. `extends:` merges `variables:`/`id_tokens:` key-by-key with the extending job's own
# (a job that redeclares a key here wins for that key only); `before_script:`/`script:`/
# `after_script:`/`artifacts:` are NOT merged — a job that declares its own replaces the base's
# wholesale, which is why every one of `script:`/`after_script:`/`artifacts:` below is redeclared
# in full by each real job rather than assumed inherited.
# --------------------------------------------------------------------------------------------
.provision-base:
  image:
    name: $APP_IAC_IMAGE
    entrypoint: ['']
  variables:
    # No Docker daemon on this runner — terraform.sh/ansible.sh/dns.sh run natively inside this
    # job's own image (see kit-modules/basis/sh/lib/iac-exec.sh). This is the ONLY place in this
    # file IAC_NATIVE is set — never let it leak in unset (would silently try `docker compose`,
    # which doesn't exist here).
    IAC_NATIVE: "1"
    COMPOSER_ALLOW_SUPERUSER: "1"
    ENVIRONMENT_TYPE: $[[ inputs.ENVIRONMENT_TYPE ]]
    ACTION_TYPE: $[[ inputs.ACTION_TYPE ]]
    SKIP_ANSIBLE: $[[ inputs.SKIP_ANSIBLE ]]
    PLAN_JOB_ID: $[[ inputs.PLAN_JOB_ID ]]
    CONFIRM_DESTROY: $[[ inputs.CONFIRM_DESTROY ]]
  # Shared across all three real jobs — the existing string, unchanged. See the file header
  # "Job split" comment above and .claude/rules/gitlab-ci.md for the full reasoning; the short
  # version: per-kind resource groups were considered and rejected as a live-infrastructure
  # safety regression, and the whole-chain exclusion this single group provides only holds once
  # its process mode is set to `oldest_first` via the GitLab API (a one-time, per-environment,
  # out-of-repo manual step — see the plan's Manual gate).
  resource_group: provision-$ENVIRONMENT_TYPE
  environment:
    name: $ENVIRONMENT_TYPE
  # AWS credentials come from GitLab's own OIDC ID token, not a static secret — audience must be
  # sts.amazonaws.com to match the "aud" condition oidc.sh -p gitlab writes into both roles' trust
  # policies (kit-modules/basis/sh/aws/oidc.sh).
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    # 1) Re-run the stage/env guard — see the header comment above for why this can't be trusted
    #    from validate-provision-inputs' own run.
    - |
      case "$ENVIRONMENT_TYPE" in
        dev|prod) ;;
        *)
          echo "Error: ENVIRONMENT_TYPE '$ENVIRONMENT_TYPE' is not supported by this pipeline yet — 'stage' has a Terraform environment (kit-modules/basis/terraform/envs/stage) but no Ansible host wired up (ansible/inventory.yml), so provisioning would create an EC2 instance Ansible cannot then configure. Only 'dev' and 'prod' are currently supported." >&2
          exit 1
          ;;
      esac
    # 2) Region, extracted fresh in this container.
    - REGION="$(sh ./sh/ci/extract-aws-region.sh)"
    - 'echo "AWS region: $REGION"'
    - export AWS_DEFAULT_REGION="$REGION"
    # 3) Re-run the destroy confirmation guard — must still happen before any credential step.
    - |
      if [ "$ACTION_TYPE" = "destroy" ]; then
        sh ./sh/ci/confirm-match.sh "$ENVIRONMENT_TYPE" "$CONFIRM_DESTROY" "CONFIRM_DESTROY"
      fi
    # 4) .env prep, native (no Docker) — same pattern as build-basis above. build-basis's own
    #    generated .env is NOT part of its artifacts (only vendor/, kit-modules/, composer.lock
    #    are), so this job regenerates its own — terraform.sh/ansible.sh/dns.sh all `source ./.env`
    #    themselves, they just need the file to exist with today's TF_VAR_*/DEFAULT_USER values.
    #    The CLOUDFLARE_API_TOKEN append below must run BEFORE init.sh — sh/env/.env.secret.template
    #    registers an empty `CLOUDFLARE_API_TOKEN=` line (Task 1.3), so without this append,
    #    init.sh's `source ./.env` inside dns.sh would silently clobber a real project CI/CD
    #    variable with that empty value (the plan's Architecture notes §10 "clobber trap" —
    #    mirrors how COMPOSER_AUTH is already handled on the GitHub side in
    #    .github/actions/provision-setup/action.yml's "Prepare .env" step).
    - (cd config/environment && sh "$CI_PROJECT_DIR/sh/env/pass_gen.sh")
    - |
      if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
        echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}" >> ./config/environment/.env.secret
      fi
    - bash ./sh/env/init.sh "$ENVIRONMENT_TYPE"
    - source ./.env
    # 5) has_basis, computed and logged BEFORE the AWS/OIDC step below — kit-modules/basis is
    #    already on disk from build-basis's artifacts at this point.
    - |
      set +e
      BASIS_OUTPUT="$(sh ./sh/ci/verify-basis.sh 2>verify-basis.stderr)"
      BASIS_RC=$?
      set -e
      BASIS_MSG="$(cat verify-basis.stderr)"
      rm -f verify-basis.stderr
      if [ $BASIS_RC -ne 0 ]; then
        echo "Error: ${BASIS_MSG}"
        exit 1
      fi
      echo "$BASIS_MSG"
      export HAS_BASIS="${BASIS_OUTPUT#has_basis=}"
      echo "has_basis=${HAS_BASIS}"
    # 5.5) TFPLAN_PASSPHRASE availability + pinned-plan retrieval. Both are
    #      GitLab-API/GPG operations independent of AWS credentials, so they run BEFORE the
    #      OIDC/STS exchange (step 6) below — an operator who mistyped PLAN_JOB_ID or forgot
    #      TFPLAN_PASSPHRASE finds out immediately, without spending an AWS role assumption on a
    #      run that was always going to need re-dispatching. See the header comment above for the
    #      full design (job-ID vs run-ID, JOB-TOKEN/PRIVATE-TOKEN fallback, fail-loud contract).
    - |
      if [ "$HAS_BASIS" = "true" ]; then
        if [ -n "$TFPLAN_PASSPHRASE" ]; then
          export HAS_TFPLAN_PASSPHRASE=true
        else
          export HAS_TFPLAN_PASSPHRASE=false
          echo "WARNING: TFPLAN_PASSPHRASE CI/CD variable is not set — a 'plan' run below will not encrypt/upload a pinned-plan artifact, and an 'apply' run cannot decrypt a pinned plan even if PLAN_JOB_ID is given (plaintext plans are never uploaded)."
        fi
        echo "TFPLAN_PASSPHRASE is set: ${HAS_TFPLAN_PASSPHRASE}"
      fi
    - |
      if [ "$HAS_BASIS" = "true" ] && [ "$ACTION_TYPE" = "apply" ] && [ -n "$PLAN_JOB_ID" ]; then
        echo "PLAN_JOB_ID='${PLAN_JOB_ID}' — fetching pinned plan artifact via the GitLab Job Artifacts API..."
        set +e
        HTTP_CODE="$(curl --silent --show-error --location --output tfplan-download.zip --write-out '%{http_code}' \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${PLAN_JOB_ID}/artifacts")"
        CURL_RC=$?
        set -e
        if { [ $CURL_RC -ne 0 ] || [ "$HTTP_CODE" != "200" ]; } && [ -n "$PLAN_ARTIFACT_TOKEN" ]; then
          echo "JOB-TOKEN fetch failed (curl exit ${CURL_RC}, HTTP ${HTTP_CODE}) — retrying with PRIVATE-TOKEN (PLAN_ARTIFACT_TOKEN)..."
          set +e
          HTTP_CODE="$(curl --silent --show-error --location --output tfplan-download.zip --write-out '%{http_code}' \
            --header "PRIVATE-TOKEN: ${PLAN_ARTIFACT_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${PLAN_JOB_ID}/artifacts")"
          CURL_RC=$?
          set -e
        fi
        if [ $CURL_RC -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
          echo "Error: Pinned Terraform plan for job '${PLAN_JOB_ID}' could not be retrieved (Job Artifacts API returned HTTP ${HTTP_CODE}, curl exit ${CURL_RC}). An explicit PLAN_JOB_ID was provided, so this run is stopping instead of silently falling back to an unreviewed same-run plan-then-apply. Verify the job ID, that its 'tfplans.tar.gz.gpg' artifact still exists (7-day retention on GitHub's equivalent; here it shares this job's 30-day expiry), and that JOB-TOKEN or PLAN_ARTIFACT_TOKEN has read access to it, then re-dispatch." >&2
          rm -f tfplan-download.zip
          exit 1
        fi
        set +e
        unzip -o -q tfplan-download.zip
        UNZIP_RC=$?
        set -e
        rm -f tfplan-download.zip
        if [ $UNZIP_RC -ne 0 ] || [ ! -f tfplans.tar.gz.gpg ]; then
          echo "Error: Pinned Terraform plan for job '${PLAN_JOB_ID}' could not be unpacked — the downloaded artifact did not contain 'tfplans.tar.gz.gpg' (unzip exit ${UNZIP_RC}). Stopping instead of falling back to plan-then-apply." >&2
          exit 1
        fi
        set +e
        gpg --batch --yes --decrypt --passphrase "$TFPLAN_PASSPHRASE" \
          --output tfplans.tar.gz tfplans.tar.gz.gpg 2>gpg-decrypt.stderr
        GPG_RC=$?
        set -e
        rm -f tfplans.tar.gz.gpg
        if [ $GPG_RC -ne 0 ]; then
          echo "Error: Pinned Terraform plan for job '${PLAN_JOB_ID}' could not be decrypted (gpg exit ${GPG_RC}). Verify TFPLAN_PASSPHRASE matches the one used to encrypt this plan. Stopping instead of falling back to an unreviewed plan-then-apply." >&2
          cat gpg-decrypt.stderr >&2
          rm -f gpg-decrypt.stderr tfplans.tar.gz
          exit 1
        fi
        rm -f gpg-decrypt.stderr
        tar xzf tfplans.tar.gz
        rm -f tfplans.tar.gz
        echo "- **Plan source:** pinned plan from job \`${PLAN_JOB_ID}\`" >> provision-summary.md
      elif [ "$HAS_BASIS" = "true" ] && [ "$ACTION_TYPE" = "apply" ]; then
        echo "- **Plan source:** same-run plan-then-apply (no pinned plan used, PLAN_JOB_ID empty)" >> provision-summary.md
      fi
    # 6) Exchange the GitLab OIDC ID token for short-lived AWS credentials. Not gated on
    #    HAS_BASIS: mirrors job-provision.yml, which configures AWS credentials unconditionally
    #    and only gates the Terraform/Ansible/DNS steps further down on has_basis. This is also
    #    the wall gitlab-ci-local execution is expected to hit — no real id_tokens JWT is minted
    #    locally, so this call is the first (and only) step that requires real AWS/GitLab OIDC
    #    trust to succeed.
    - |
      echo "Assuming AWS role via GitLab OIDC (AWS_ROLE_TO_ASSUME)..."
      set +e
      STS_JSON="$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_TO_ASSUME" \
        --role-session-name "gitlab-provision-${CI_PIPELINE_ID}-${CI_JOB_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 2>sts.stderr)"
      STS_RC=$?
      set -e
      if [ $STS_RC -ne 0 ]; then
        echo "Error: OIDC token unavailable or STS denied the web-identity exchange (aws sts assume-role-with-web-identity failed). Verify AWS_ROLE_TO_ASSUME is a valid role ARN, the GitLab OIDC identity provider exists in this AWS account, and the role's trust policy matches this project (see kit-modules/basis/sh/aws/oidc.sh -p gitlab -m test)." >&2
        cat sts.stderr >&2
        rm -f sts.stderr
        exit 1
      fi
      rm -f sts.stderr
      export AWS_ACCESS_KEY_ID="$(echo "$STS_JSON" | jq -r '.Credentials.AccessKeyId')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$STS_JSON" | jq -r '.Credentials.SecretAccessKey')"
      export AWS_SESSION_TOKEN="$(echo "$STS_JSON" | jq -r '.Credentials.SessionToken')"
      echo "AWS credentials configured via OIDC"
      echo "AWS_ACCESS_KEY_ID is set: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo yes || echo no)"
      echo "AWS_SESSION_TOKEN is set: $([ -n "$AWS_SESSION_TOKEN" ] && echo yes || echo no)"
    # 7) SSH — private key from the SSH_KEY/SSH_CONFIG File-type CI/CD variables.
    - SSH_INPUT_MODE=file sh ./sh/ci/setup-ssh.sh
    # 8) SSH public key for Terraform's aws_key_pair.deploy — same derivation as
    #    job-provision.yml's "Extract SSH public key for Terraform" step, gated on has_basis so a
    #    genuinely unlicensed run never touches kit-modules/basis/terraform/public_keys/.
    - |
      if [ "$HAS_BASIS" = "true" ]; then
        ssh-keygen -y -f ~/.ssh/id_rsa > "kit-modules/basis/terraform/public_keys/${TF_VAR_sk_ssh_key_name}.pub"
        echo "SSH public key extracted for Terraform:"
        cat "kit-modules/basis/terraform/public_keys/${TF_VAR_sk_ssh_key_name}.pub"
      else
        echo "has_basis=false — skipping SSH public key extraction for Terraform."
      fi
    # 9) State-backend bucket guard — same "not a permissions problem" message as
    #    job-provision.yml's "Verify Terraform state backend exists" step.
    - |
      if [ "$HAS_BASIS" = "true" ]; then
        if ! aws s3api head-bucket --bucket "$TF_VAR_tf_backend_bucket" --region "$AWS_DEFAULT_REGION" 2>/dev/null; then
          echo "Error: Terraform state backend bucket '${TF_VAR_tf_backend_bucket}' does not exist or is not accessible. This is not an AWS permissions problem — the CI role deliberately has no s3:CreateBucket permission. The state backend must be bootstrapped once, before provisioning can run. Dispatch the 'bootstrap-state' pipeline (PIPELINE_KIND=bootstrap-state) against this AWS account, then re-run this pipeline." >&2
          exit 1
        fi
        echo "Terraform state backend bucket '${TF_VAR_tf_backend_bucket}' is accessible."
      fi

provision:
  stage: provision
  extends: .provision-base
  needs:
    - build-basis
  rules:
    - if: '$PIPELINE_KIND == "provision"'
  script:
    - |
      if [ "$HAS_BASIS" != "true" ]; then
        echo "No license/module — skipping Terraform."
        {
          echo "## Infrastructure Provisioning Summary"
          echo "**Action:** ${ACTION_TYPE}"
          echo "**Environment:** ${ENVIRONMENT_TYPE}"
          echo "**Result:** skipped — kit-modules/basis is not licensed/installed (has_basis=false)"
        } > provision-summary.md
        cat provision-summary.md
        printf 'INSTANCE_IPV4=\nINSTANCE_IPV6=\n' > dns.env
        exit 0
      fi
    # TFPLAN_PASSPHRASE availability and pinned-plan retrieval (PLAN_JOB_ID) both already ran in
    # before_script, step 5.5 — before the AWS OIDC exchange, since neither needs AWS
    # credentials. HAS_TFPLAN_PASSPHRASE is already exported; tfplans/*.tfplan is already
    # unpacked on disk if a pinned plan was requested and retrieved successfully.
    # 'shared' is the only cross-environment bulkhead this pipeline runs automatically — it must
    # never be destroyed as a side effect of tearing down one environment's EC2 instance. Only
    # plan/apply run 'shared'; destroy is scoped to the environment layer only (no dedicated
    # destroy path for 'shared' from this pipeline — see job-provision.yml/ci.md for the same rule
    # on the GitHub side). On plan, -f pins the plan file for a later encrypt+upload; on apply, a
    # pinned plan file already unpacked above (by PLAN_JOB_ID) is applied via -f, otherwise a
    # fresh plan-then-apply runs.
    - |
      if [ "$ACTION_TYPE" != "destroy" ]; then
        echo "- shared: running (${ACTION_TYPE})" >> provision-summary.md
        bash kit-modules/basis/sh/terraform.sh -e shared -c init
        if [ "$ACTION_TYPE" = "plan" ]; then
          bash kit-modules/basis/sh/terraform.sh -e shared -c plan -f tfplans/shared.tfplan
        elif [ -f tfplans/shared.tfplan ]; then
          echo "- shared: applying pinned plan" >> provision-summary.md
          if ! bash kit-modules/basis/sh/terraform.sh -e shared -c apply -f tfplans/shared.tfplan; then
            echo "Error: Pinned Terraform plan for layer 'shared' was rejected (likely stale vs current remote state). Re-run 'plan', review the new plan, and re-apply with the new PLAN_JOB_ID. No auto-retry was performed." >&2
            exit 1
          fi
        else
          echo "- shared: plan-then-apply (no pinned plan)" >> provision-summary.md
          bash kit-modules/basis/sh/terraform.sh -e shared -c apply
        fi
      else
        echo "- shared: skipped — destroy only tears down the '${ENVIRONMENT_TYPE}' environment layer, never the shared network" >> provision-summary.md
      fi
    # Pre-destroy state backup — must complete, and abort on empty state, BEFORE the
    # environment-layer 'terraform.sh -c destroy' call below runs. 'terraform.sh -c state-pull'
    # runs its own internal init (see kit-modules/basis/sh/terraform.sh) and writes ONLY the
    # pulled state JSON to stdout, so redirecting straight to a file yields clean JSON with no
    # init chatter mixed in. An empty/missing backup means we have no recoverable snapshot of
    # this environment's state, so destroying it would be irreversible from CI's side — abort
    # instead of proceeding. Same TFPLAN_PASSPHRASE-gated GPG shape as the pinned-plan encryption
    # above (HAS_TFPLAN_PASSPHRASE already exported in before_script step 5.5): encrypt + keep
    # when the passphrase is set, otherwise remove the plaintext and warn — state files can
    # contain sensitive resource attributes, so plaintext state is never uploaded as an artifact
    # either way (unlike the pinned-plan case, which is fine to just skip-without-uploading; here
    # the backup attempt itself still has to happen, for the abort-on-empty check, it just can't
    # persist as plaintext afterward).
    - |
      if [ "$ACTION_TYPE" = "destroy" ]; then
        echo "- ${ENVIRONMENT_TYPE}: pre-destroy state backup" >> provision-summary.md
        bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c state-pull > tfstate-backup.json
        if [ ! -s tfstate-backup.json ]; then
          echo "Error: terraform state pull returned no output for layer '${ENVIRONMENT_TYPE}' — aborting destroy without a state backup." >&2
          exit 1
        fi
        if [ "$HAS_TFPLAN_PASSPHRASE" = "true" ]; then
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$TFPLAN_PASSPHRASE" \
            --output tfstate-backup.json.gpg tfstate-backup.json
          rm -f tfstate-backup.json
          echo "- **State backup:** \`tfstate-backup.json.gpg\` uploaded" >> provision-summary.md
        else
          rm -f tfstate-backup.json
          echo "WARNING: TFPLAN_PASSPHRASE CI/CD variable is not set — a pre-destroy Terraform state snapshot for layer '${ENVIRONMENT_TYPE}' was captured but NOT uploaded as an artifact (plaintext state is never uploaded). If this destroy needs to be reverted, there is no CI-side recovery snapshot for this run — re-provisioning from scratch is the only path."
          echo "- **Warning:** \`TFPLAN_PASSPHRASE\` is not configured — a pre-destroy state snapshot was captured but NOT uploaded (plaintext state is never uploaded as an artifact)." >> provision-summary.md
        fi
      fi
    - |
      echo "- ${ENVIRONMENT_TYPE}: running (${ACTION_TYPE})" >> provision-summary.md
      bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c init
      if [ "$ACTION_TYPE" = "plan" ]; then
        bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c plan -f "tfplans/${ENVIRONMENT_TYPE}.tfplan"
      elif [ "$ACTION_TYPE" = "apply" ]; then
        if [ -f "tfplans/${ENVIRONMENT_TYPE}.tfplan" ]; then
          echo "- ${ENVIRONMENT_TYPE}: applying pinned plan" >> provision-summary.md
          if ! bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c apply -f "tfplans/${ENVIRONMENT_TYPE}.tfplan"; then
            echo "Error: Pinned Terraform plan for layer '${ENVIRONMENT_TYPE}' was rejected (likely stale vs current remote state). Re-run 'plan', review the new plan, and re-apply with the new PLAN_JOB_ID. No auto-retry was performed." >&2
            exit 1
          fi
        else
          echo "- ${ENVIRONMENT_TYPE}: plan-then-apply (no pinned plan)" >> provision-summary.md
          bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c apply
        fi
      else
        bash kit-modules/basis/sh/terraform.sh -e "$ENVIRONMENT_TYPE" -c destroy -y
      fi
    # Package + GPG-encrypt (AES256, same shape as job-provision.yml) the reviewed plan for later
    # pinned retrieval via PLAN_JOB_ID — gated on TFPLAN_PASSPHRASE; unset ⇒ loud warning, never a
    # failure. CI_JOB_ID is this job's own ID, printed so the operator knows what to pass as
    # PLAN_JOB_ID on a later apply run.
    - |
      if [ "$ACTION_TYPE" = "plan" ]; then
        if [ "$HAS_TFPLAN_PASSPHRASE" = "true" ]; then
          tar czf tfplans.tar.gz tfplans/shared.tfplan "tfplans/${ENVIRONMENT_TYPE}.tfplan"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$TFPLAN_PASSPHRASE" \
            --output tfplans.tar.gz.gpg tfplans.tar.gz
          rm -f tfplans.tar.gz
          echo "- **Plan artifact:** \`tfplans.tar.gz.gpg\` uploaded — re-apply later with PLAN_JOB_ID=${CI_JOB_ID}" >> provision-summary.md
        else
          echo "WARNING: TFPLAN_PASSPHRASE CI/CD variable is not set — the reviewed Terraform plan was NOT encrypted or uploaded as an artifact (plaintext plans are never uploaded)."
          echo "- **Warning:** \`TFPLAN_PASSPHRASE\` is not configured — no pinned-plan artifact was produced; a later apply will fall back to same-run plan-then-apply." >> provision-summary.md
        fi
      fi
    # Terraform-output contract (plan's Architecture notes §6) — the single Terragrunt-output
    # read in this file. Only 'apply' populates real values — 'destroy' has no downstream
    # consumer of an instance IP, and 'plan' has no infrastructure yet to read outputs from.
    # dns.env always carries both keys (empty when unset/not applicable) so provision-dns's
    # `artifacts: reports: dotenv` consumption never has to special-case a missing key.
    # get_tf_output distinguishes "output not set yet" (N/A) from "terragrunt command actually
    # errored" (ERROR) so a real error is never silently treated as "no output configured" —
    # mirrors job-provision.yml's own `tf_outputs` step exactly, just without the Docker wrapper
    # (this job already runs natively, inside the iac toolchain image itself).
    - |
      if [ "$ACTION_TYPE" = "apply" ]; then
        get_tf_output() {
          local name="$1" out rc errfile
          errfile=$(mktemp)
          out=$(cd "kit-modules/basis/terraform/envs/${ENVIRONMENT_TYPE}" && terragrunt output -raw "$name" 2>"$errfile")
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "$out"
          elif grep -q "not found" "$errfile"; then
            echo "N/A"
          else
            echo "ERROR"
          fi
          rm -f "$errfile"
        }
        normalize() {
          case "$1" in
            N/A|ERROR) echo "" ;;
            *) echo "$1" ;;
          esac
        }
        IPV4_RAW=$(get_tf_output instance_public_ip)
        IPV6_RAW=$(get_tf_output instance_ipv6)
        INSTANCE_IPV4=$(normalize "$IPV4_RAW")
        INSTANCE_IPV6=$(normalize "$IPV6_RAW")
        echo "- **Terraform outputs:** ipv4=${IPV4_RAW}, ipv6=${IPV6_RAW}" >> provision-summary.md
      else
        INSTANCE_IPV4=""
        INSTANCE_IPV6=""
      fi
      {
        echo "INSTANCE_IPV4=${INSTANCE_IPV4}"
        echo "INSTANCE_IPV6=${INSTANCE_IPV6}"
      } > dns.env
    - |
      {
        echo "## Infrastructure Provisioning Summary"
        echo "**Action:** ${ACTION_TYPE}"
        echo "**Environment:** ${ENVIRONMENT_TYPE}"
        echo "**Timestamp:** $(date -u)"
        echo ""
        cat provision-summary.md 2>/dev/null || true
      } > provision-summary.md.tmp
      mv provision-summary.md.tmp provision-summary.md
      cat provision-summary.md
  after_script:
    - rm -f ~/.ssh/id_rsa ~/.ssh/config || true
  # A GitLab job carries exactly one `artifacts:` block — one `expire_in` for every path in it,
  # no per-path retention. GitHub's equivalent has three separate artifacts with three different
  # retentions (`tfplans.tar.gz.gpg` 7 days, `provision-summary.md` 30 days,
  # `tfstate-backup-<env>.json.gpg` 90 days); here they must share one value. 90 days is used for
  # the whole block — a superset of GitHub's 7/30-day windows rather than a shorter one — so the
  # state-backup artifact gets the retention it needs, and `provision-summary.md`/
  # `tfplans.tar.gz.gpg` simply live a bit longer than their GitHub counterparts (both already
  # GPG-encrypted at rest where sensitive, so the longer retention doesn't add plaintext
  # exposure). `access: developer` is defence in depth — GitLab's own docs note `artifacts:access` only affects UI/API access,
  # job-token access to the runner API is unaffected regardless, and there is no artifact-level
  # encryption-at-rest — GPG remains the actual control. `tfstate-backup.json` (plaintext) is
  # deliberately never listed here — only its `.gpg` form is, and only once a passphrase is
  # configured (see the pre-destroy backup step above): the plaintext file is always removed from
  # disk before this artifacts stage would ever pick it up. `dns.env` carries the
  # `reports: dotenv` block — a distinct artifact mechanism from `paths:`, consumed by
  # `provision-dns` via `needs:` (GitLab auto-injects dotenv-report keys as job-level CI/CD
  # variables only for jobs that declare `needs:` on the producing job).
  artifacts:
    expire_in: 90 days
    when: always
    access: developer
    paths:
      - provision-summary.md
      - tfplans.tar.gz.gpg
      - tfstate-backup.json.gpg
    reports:
      dotenv: dns.env

provision-ansible:
  stage: provision-follow
  extends: .provision-base
  needs:
    - build-basis
    - provision
  rules:
    - if: '$PIPELINE_KIND == "provision"'
  script:
    - |
      if [ "$HAS_BASIS" != "true" ]; then
        echo "No license/module — skipping Ansible."
        {
          echo "## Infrastructure Provisioning Summary — Ansible"
          echo "**Action:** ${ACTION_TYPE}"
          echo "**Environment:** ${ENVIRONMENT_TYPE}"
          echo "**Result:** skipped — kit-modules/basis is not licensed/installed (has_basis=false)"
        } > provision-summary.md
        cat provision-summary.md
        exit 0
      fi
    - |
      if [ "$ACTION_TYPE" = "apply" ] && [ "$SKIP_ANSIBLE" != "true" ]; then
        echo "- ansible: running (inventory + playbook)" >> provision-summary.md
        bash kit-modules/basis/sh/ansible.sh -e "$ENVIRONMENT_TYPE" -a inventory
        bash kit-modules/basis/sh/ansible.sh -e "$ENVIRONMENT_TYPE" -a playbook
      else
        echo "- ansible: skipped (ACTION_TYPE=${ACTION_TYPE}, SKIP_ANSIBLE=${SKIP_ANSIBLE})" >> provision-summary.md
      fi
    - |
      {
        echo "## Infrastructure Provisioning Summary — Ansible"
        echo "**Action:** ${ACTION_TYPE}"
        echo "**Environment:** ${ENVIRONMENT_TYPE}"
        echo "**Timestamp:** $(date -u)"
        echo ""
        cat provision-summary.md 2>/dev/null || true
      } > provision-summary.md.tmp
      mv provision-summary.md.tmp provision-summary.md
      cat provision-summary.md
  after_script:
    # Specific to what this job creates — moved here from the old combined `provision` job.
    - rm -f kit-modules/basis/ansible/generated.inventory.yml || true
    - rm -f ~/.ssh/id_rsa ~/.ssh/config || true
  artifacts:
    expire_in: 90 days
    when: always
    access: developer
    paths:
      - provision-summary.md

provision-dns:
  stage: provision-follow
  extends: .provision-base
  needs:
    - build-basis
    - provision
  rules:
    - if: '$PIPELINE_KIND == "provision"'
  script:
    - |
      if [ "$HAS_BASIS" != "true" ]; then
        echo "No license/module — skipping DNS."
        {
          echo "## Infrastructure Provisioning Summary — DNS"
          echo "**Action:** ${ACTION_TYPE}"
          echo "**Environment:** ${ENVIRONMENT_TYPE}"
          echo "**Result:** skipped — kit-modules/basis is not licensed/installed (has_basis=false)"
        } > provision-summary.md
        cat provision-summary.md
        exit 0
      fi
    # INSTANCE_IPV4/INSTANCE_IPV6 arrive as ordinary CI/CD variables — GitLab auto-injects the
    # `provision` job's `dns.env` (reports: dotenv) keys because this job's `needs:` lists
    # `provision` (plan's Architecture notes §6). -4/-6 are passed even when empty, matching
    # job-provision.yml's `dns` job invocation exactly — dns.sh's own empty-override branch falls
    # back to resolving that family from Terraform state, so a missing IPv6 output never blocks
    # the still-valid IPv4 record.
    - |
      if [ "$ACTION_TYPE" = "apply" ]; then
        echo "- dns: running" >> provision-summary.md
        bash kit-modules/basis/sh/dns.sh -e "$ENVIRONMENT_TYPE" -4 "${INSTANCE_IPV4:-}" -6 "${INSTANCE_IPV6:-}" -y
        echo "- dns: completed" >> provision-summary.md
      else
        echo "- dns: skipped (ACTION_TYPE=${ACTION_TYPE})" >> provision-summary.md
      fi
    - |
      {
        echo "## Infrastructure Provisioning Summary — DNS"
        echo "**Action:** ${ACTION_TYPE}"
        echo "**Environment:** ${ENVIRONMENT_TYPE}"
        echo "**Timestamp:** $(date -u)"
        echo ""
        cat provision-summary.md 2>/dev/null || true
      } > provision-summary.md.tmp
      mv provision-summary.md.tmp provision-summary.md
      cat provision-summary.md
  after_script:
    - rm -f ~/.ssh/id_rsa ~/.ssh/config || true
  artifacts:
    expire_in: 90 days
    when: always
    access: developer
    paths:
      - provision-summary.md
