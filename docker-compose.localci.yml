services:

  # LocalStack Community — emulates AWS S3/EC2/STS for the local CI/CD provisioning
  # emulation harness (sh/local-ci/*). Never part of the always-running app stack
  # (docker-compose.yml) or the on-demand toolkit stack (docker-compose.toolkit.yml) — this file
  # is only brought up by sh/local-ci/harness-up.sh and torn down by sh/local-ci/harness-down.sh.
  localstack:
    # Pinned — deliberately NOT `:latest`. `latest` currently resolves to an image build that
    # hard-requires a LOCALSTACK_AUTH_TOKEN (Pro license) and refuses to start even when only
    # community services are requested. `4.9` (resolves to 4.9.2, edition "community") is the
    # verified-working pin. See sh/local-ci/EVIDENCE.md for the exact failure this
    # avoids and the verification of the pinned tag.
    image: localstack/localstack:4.9
    container_name: "${APP_NAME}-localci-localstack"
    restart: "no"
    ports:
      - "4566:4566"
    environment:
      # Only the services basis's Terraform actually uses (verified: zero aws_iam_*/aws_dynamodb_*
      # resources in kit-modules/basis/terraform/, see sh/local-ci/EVIDENCE.md) — no `iam`, no
      # `dynamodb` (S3-native locking, no DynamoDB table anywhere in this module).
      SERVICES: s3,ec2,sts
    # No volume / persistence: LocalStack Community does not persist state across container
    # restarts regardless, and this harness is one-shot verification, not a long-lived sandbox
    # (documented limitation, see sh/local-ci/README.md).

  # Bare Docker SSH target for kit-modules/basis's real Ansible playbook (sh/local-ci/*)
  # — see contract 5 in .claude/plans/architect-plan-provisioning-epic.md. Not Molecule: basis's
  # playbook has no roles, so there is no role-scenario unit for Molecule to drive; a plain
  # systemd-as-PID-1 SSH target matches basis's actual connection type (default SSH via a
  # Terraform-generated/static inventory) with no restructuring of a licensed module.
  ansible-target:
    build:
      context: ./dockerfiles/ansible-target
    image: "${APP_NAME}-localci-ansible-target"
    container_name: "${APP_NAME}-localci-ansible-target"
    hostname: ansible-target
    restart: "no"
    # systemd as PID 1 needs real privileges + its own cgroup namespace to manage services —
    # standard practice for Ansible-against-a-container testing. `cgroup: host` (Compose
    # Specification key, maps to `docker run --cgroupns=host`) rather than an explicit
    # /sys/fs/cgroup bind mount: this host runs cgroup v2 (`docker info` → `Cgroup Version: 2`),
    # where `--privileged` already grants the necessary /sys/fs/cgroup access and the extra mount
    # is not needed — verified live, see sh/local-ci/EVIDENCE.md.
    privileged: true
    cgroup: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
    volumes:
      # Read-only: the harness's throwaway SSH public key, regenerated on every harness-up.sh run.
      # Injected into admin's authorized_keys at container START by
      # dockerfiles/ansible-target/docker-entrypoint.sh, never baked into the image — see that
      # Dockerfile's header comment for why (rebuild avoidance + this repo's own
      # "never bake secrets into an image" rule, already stated in dockerfiles/iac/Dockerfile).
      - ./kit-modules/basis/terraform/public_keys:/harness-keys:ro

# Mirrors the top-level `networks:` declaration already present in docker-compose.yml and
# docker-compose.toolkit.yml. In both of those files no service declares a per-service
# `networks:` key, so what actually joins their containers together in practice is Compose's own
# implicit `<project>_default` network, not this named block — the project name is derived from
# the invoking directory (this repo root) and is identical across all three compose files as long
# as none of them is run with an explicit `-p`/`--project-name` override, which nothing in this
# repo does. This block is kept only for parity with the existing files' shape; the real wiring
# this service depends on is "same directory, no -p override, no per-service `networks:` key".
#
# NOT YET PROVEN LIVE — static authoring only in this pass. Being "done" requires a real
#   docker compose -f docker-compose.toolkit.yml run --rm iac bash -lc \
#     "curl -s http://localstack:4566/_localstack/health"
# returning JSON with "s3"/"ec2"/"dynamodb" available, run from inside the `iac` container while
# this file's `localstack` service is up — that live proof happens at harness runtime,
# not here.
networks:
  project_network:
    external: true
