services:

  mariadb:
    image: "${APP_DATABASE_IMAGE}"
    container_name: "${APP_NAME}-mariadb"
    restart: unless-stopped
    env_file: .env.runtime
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Official MariaDB image healthcheck script. Credentials come from the dedicated healthcheck
    # user the image entrypoint provisions in $datadir/.my-healthcheck.cnf — nothing to configure
    # here, and no password on the command line.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Uncomment this to reset root password and run inside container mariadb> FLUSH PRIVILEGES; ALTER USER 'root'@'%' IDENTIFIED BY 'new_password';
    #command: --skip-grant-tables
    volumes:
      - ./db-data:/var/lib/mysql

  php:
    image: "${APP_PHP_IMAGE}"
    container_name: "${APP_NAME}-php"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    working_dir: /srv/web
    env_file: .env.runtime
    environment:
      CURRENT_UID: ${CURRENT_UID:-$DEFAULT_UID}
      CURRENT_GID: ${CURRENT_GID:-$DEFAULT_GID}

      # DataBase options (client)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      #MYSQL_DB_PREFIX: ${MYSQL_DB_PREFIX:-}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WP_DB_CHARSET: ${WP_DB_CHARSET:-}
      WP_DB_COLLATE: ${WP_DB_COLLATE:-}
      WP_AUTH_KEY: ${WP_AUTH_KEY:-}
      WP_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY:-}
      WP_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY:-}
      WP_NONCE_KEY: ${WP_NONCE_KEY:-}
      WP_AUTH_SALT: ${WP_AUTH_SALT:-}
      WP_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT:-}
      WP_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT:-}
      WP_NONCE_SALT: ${WP_NONCE_SALT:-}

      # SMTP config
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      # WP install credentials
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    # Maps licensing-server's local domain to the Docker host gateway, where the shared Traefik
    # proxy listens on port 80/443 (APP_MULTI_INSTANCE=1). Without this, this container's default
    # DNS resolves licensing.starter-kit.loc to 127.0.0.1 (the host's own .loc resolver) and every
    # server-to-server call to licensing-server times out — verified, see the order-status proxy
    # plan's Architecture notes / Risks ("Local reachability").
    extra_hosts:
      - "licensing.starter-kit.loc:host-gateway"
    volumes:
      # Web root folder
      - ./web/wp-core:/srv/web
      # WordPress wp-content folder
      - ./web/wp-content:/srv/web/wp-content
      # Debug log
      - ./logs/wordpress:/var/log/wordpress
      # Cache folder
      - ./cache/php:/srv/cache
      # PHP ini config
      - ./config/php:/usr/local/etc/php
      # Share shell scripts
      - ./sh:/shell:ro
    # Direct php-fpm ping probe (bypasses nginx entirely) via cgi-fcgi against the ping.path
    # enabled in dockerfiles/php/zz-healthcheck.conf. Catches a wedged/dead FPM master even
    # though nginx's own /health check (config/common.conf.template) never reaches PHP.
    healthcheck:
      test: ["CMD-SHELL", "REQUEST_METHOD=GET SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping cgi-fcgi -bind -connect 127.0.0.1:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: "${APP_NGINX_IMAGE}"
    container_name: "${APP_NAME}-nginx"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      php:
        condition: service_healthy
    working_dir: /srv/web
    env_file: .env.runtime
    environment:
      APP_BA_USER: ${APP_BA_USER:-}
      APP_BA_PASS: ${APP_BA_PASS:-}
    # Liveness probe against the nginx-only /health endpoint (config/nginx/config/common.conf.template).
    # Host header is required: without it the request falls to the `server_name _` default server
    # in default.conf.template and gets 444. APP_PROTOCOL/APP_DOMAIN are resolved at probe time
    # inside the container ($$ = not interpolated by Compose) so multi-instance mode, where the
    # proxy override forces APP_PROTOCOL=http for this container only, stays correct.
    # -k: local/dummy certs (make ssl bootstrap, make local-cert) are not publicly trusted.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -k --max-time 5 -H \"Host: $${APP_DOMAIN}\" \"$${APP_PROTOCOL:-http}://127.0.0.1/health\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    networks:
      default:
        # Add alias for nginx container to connect from other containers (node watcher for example)
        aliases:
          - "${APP_DOMAIN}"
    volumes:
      # Web root folder
      - ./web/wp-core:/srv/web
      # WordPress wp-content folder
      - ./web/wp-content:/srv/web/wp-content
      # Nginx config
      - ./config/nginx:/etc/nginx/templates:ro
      # SSL files
      - ./config/ssl:/etc/nginx/ssl:ro
      # Logs
      - ./logs/nginx:/var/log/nginx

  cron:
    image: "${APP_CRON_IMAGE}"
    container_name: "${APP_NAME}-cron"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      php:
        condition: service_healthy
    env_file: .env.runtime
    environment:
      CURRENT_UID: ${CURRENT_UID:-$DEFAULT_UID}
      CURRENT_GID: ${CURRENT_GID:-$DEFAULT_GID}
      WORKING_DIR: ${WORKING_DIR:-$DEFAULT_PATH}
    working_dir: ${WORKING_DIR:-$DEFAULT_PATH}
    # start-cron.sh backgrounds crond and keeps the container alive with a `cat` loop, so a dead
    # crond leaves the container "up" and restart: unless-stopped never fires. This probe is the
    # only thing that surfaces that state.
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # Share docker socket to allow cron run scenarios inside other containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Share crontabs files into tmp folder
      - ./config/cron/crontabs:/tmp/crontabs
      # Share all app files
      - ${WORKING_DIR:-$DEFAULT_PATH}:${WORKING_DIR:-$DEFAULT_PATH}

networks:
  project_network:
    driver: bridge
