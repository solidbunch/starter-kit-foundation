name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_TYPE:
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        description: Required. Select target environment type

env:
  # Defaults if not provided by env files
  DEFAULT_EFFECTIVE_ENV_TYPE: dev

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          if [ -n "${{ secrets.COMPOSER_AUTH }}" ]; then
            echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          fi
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Update Basis (only in demo)
        env:
          IS_DEMO: ${{ secrets.IS_DEMO }}
        run: |
          if [ "$IS_DEMO" = "true" ]; then
            echo "Detected demo mode — forcing Composer update from dist"
            export CURRENT_UID=$(id -u)
            export CURRENT_GID=$(id -g)
            source .env
            docker compose -f docker-compose.build.yml run --rm composer su -c "
              composer update solidbunch/basis --no-interaction --with-all-dependencies
            " "${DEFAULT_USER}"
          else
            echo "Skipping composer update — not in demo mode"
          fi

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      - name: Verify Basis module is installed
        id: verify_basis
        run: |
          if [ ! -d "kit-modules/basis" ]; then
            echo "Basis module is not installed. Skipping provisioning."
            echo "has_basis=false" >> $GITHUB_OUTPUT
          else
            echo "Basis module found."
            echo "has_basis=true" >> $GITHUB_OUTPUT
          fi

      - name: Short-circuit when Basis is missing
        if: steps.verify_basis.outputs.has_basis == 'false'
        run: |
          echo "No license/module — skipping Terraform and Ansible."

      - name: Resolve Terraform paths
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          # Load the resulting .env to access ENVIRONMENT and other vars
          set -a
          [ -f ./.env ] && source ./.env || true
          set +a
          # Effective env type comes strictly from workflow input
          EFFECTIVE_ENV_TYPE="${{ inputs.ENVIRONMENT_TYPE }}"
          echo "EFFECTIVE_ENV_TYPE=$EFFECTIVE_ENV_TYPE" >> $GITHUB_ENV
          echo "TF_STATE_DIR=kit-modules/basis/terraform/state" >> $GITHUB_ENV
          echo "TF_SHARED_DIR=kit-modules/basis/terraform/envs/shared" >> $GITHUB_ENV
          echo "TF_ENV_DIR=kit-modules/basis/terraform/envs/$EFFECTIVE_ENV_TYPE" >> $GITHUB_ENV
          # Validate Terraform env directory
          if [ ! -d "$GITHUB_WORKSPACE/$TF_ENV_DIR" ]; then
            echo "Terraform environment directory '$TF_ENV_DIR' not found (basis maps $EFFECTIVE_ENV_TYPE)" >&2; exit 1;
          fi

      - name: Setup Terraform CLI
        if: steps.verify_basis.outputs.has_basis == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Derive AWS region from env
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          set -a
          [ -f ./.env ] && source ./.env || true
          set +a
          : # Only read if present; no guesses
          if [ -n "$AWS_REGION" ]; then echo "AWS_REGION_EFFECTIVE=$AWS_REGION" >> $GITHUB_ENV; fi
          if [ -n "$AWS_DEFAULT_REGION" ] && [ -z "$AWS_REGION_EFFECTIVE" ]; then echo "AWS_REGION_EFFECTIVE=$AWS_DEFAULT_REGION" >> $GITHUB_ENV; fi

      - name: Configure AWS credentials
        if: steps.verify_basis.outputs.has_basis == 'true' && env.AWS_REGION_EFFECTIVE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_EFFECTIVE }}

      - name: Show provisioning plan
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          echo "EFFECTIVE_ENV_TYPE=$EFFECTIVE_ENV_TYPE"
          echo "TF_STATE_DIR=$TF_STATE_DIR"
          echo "TF_SHARED_DIR=$TF_SHARED_DIR"
          echo "TF_ENV_DIR=$TF_ENV_DIR"

      - name: Terraform apply — state backend
        if: steps.verify_basis.outputs.has_basis == 'true'
        working-directory: ${{ env.TF_STATE_DIR }}
        run: |
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color

      - name: Terraform apply — shared network
        if: steps.verify_basis.outputs.has_basis == 'true'
        working-directory: ${{ env.TF_SHARED_DIR }}
        run: |
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color

      - name: Terraform apply — environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          if [ -d "$TF_ENV_DIR" ]; then
            cd "$TF_ENV_DIR"
            terraform init -input=false -no-color
            terraform apply -auto-approve -input=false -no-color
          else
            echo "Environment directory '$TF_ENV_DIR' not found — skipping env apply."
            exit 1
          fi

      - name: Fetch Terraform outputs for inventory
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          set +e
          IPV4=$(terraform -chdir="$TF_ENV_DIR" output -raw instance_public_ip 2>/dev/null)
          IPV6=$(terraform -chdir="$TF_ENV_DIR" output -raw instance_ipv6 2>/dev/null)
          set -e
          echo "TF_INSTANCE_IPV4=$IPV4" >> $GITHUB_ENV
          echo "TF_INSTANCE_IPV6=$IPV6" >> $GITHUB_ENV

      - name: Generate dynamic Ansible inventory from Terraform outputs
        if: steps.verify_basis.outputs.has_basis == 'true'
        working-directory: kit-modules/basis/ansible
        run: |
          HOST_IP="${TF_INSTANCE_IPV6:-$TF_INSTANCE_IPV4}"
          if [ -z "$HOST_IP" ]; then
            echo "No instance IP found in Terraform outputs; cannot build inventory" >&2; exit 1
          fi
          printf "all:\n" > generated.inventory.yml
          printf "  vars:\n" >> generated.inventory.yml
          printf "    ansible_python_interpreter: /usr/bin/python3.11\n" >> generated.inventory.yml
          printf "  children:\n" >> generated.inventory.yml
          printf "    development:\n" >> generated.inventory.yml
          printf "      hosts:\n" >> generated.inventory.yml
          printf "        provisioned-host:\n" >> generated.inventory.yml
          printf "          ansible_host: %s\n" "${HOST_IP}" >> generated.inventory.yml
          printf "          ansible_user: admin\n" >> generated.inventory.yml
          printf "    production:\n" >> generated.inventory.yml
          printf "      hosts:\n" >> generated.inventory.yml
          printf "        provisioned-host:\n" >> generated.inventory.yml
          printf "          ansible_host: %s\n" "${HOST_IP}" >> generated.inventory.yml
          printf "          ansible_user: admin\n" >> generated.inventory.yml

      - name: Install Ansible
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible

      - name: Ansible playbook (provision & configure server)
        if: steps.verify_basis.outputs.has_basis == 'true'
        working-directory: kit-modules/basis/ansible
        run: |
          if [ ! -f "generated.inventory.yml" ] || [ ! -f "playbook.yml" ]; then
            echo "Dynamic inventory or playbook not found — cannot proceed." >&2; exit 1
          fi
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i generated.inventory.yml playbook.yml


