name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_TYPE:
        description: 'Required. Select target environment type'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-24.04
    env:
      EFFECTIVE_ENV_TYPE: ${{ inputs.ENVIRONMENT_TYPE }}
      TF_ENV_DIR: kit-modules/basis/terraform/envs/${{ inputs.ENVIRONMENT_TYPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          if [ -n "${{ secrets.COMPOSER_AUTH }}" ]; then
            echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          fi
          # Inject AWS credentials for IaC container (picked via docker-compose env_file)
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ./config/environment/.env.secret
          fi
          if [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ./config/environment/.env.secret
          fi
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Update Basis (only in demo)
        env:
          IS_DEMO: ${{ secrets.IS_DEMO }}
        run: |
          if [ "$IS_DEMO" = "true" ]; then
            echo "Detected demo mode — forcing Composer update from dist"
            export CURRENT_UID=$(id -u)
            export CURRENT_GID=$(id -g)
            source .env
            docker compose -f docker-compose.toolkit.yml run --rm composer su -c "
              composer update solidbunch/basis --no-interaction --with-all-dependencies
            " "${DEFAULT_USER}"
          else
            echo "Skipping composer update — not in demo mode"
          fi

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      - name: Verify Basis module is installed
        id: verify_basis
        run: |
          if [ ! -d "kit-modules/basis" ]; then
            echo "Basis module is not installed. Skipping provisioning."
            echo "has_basis=false" >> $GITHUB_OUTPUT
          else
            echo "Basis module found."
            echo "has_basis=true" >> $GITHUB_OUTPUT
          fi

      - name: Short-circuit when Basis is missing
        if: steps.verify_basis.outputs.has_basis == 'false'
        run: |
          echo "No license/module — skipping Terraform and Ansible."

      - name: Show provisioning plan and validate environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          echo "EFFECTIVE_ENV_TYPE=${EFFECTIVE_ENV_TYPE}"
          echo "TF_ENV_DIR=${TF_ENV_DIR}"
          if [ ! -d "$TF_ENV_DIR" ]; then
            echo "Terraform environment directory '$TF_ENV_DIR' not found" >&2; exit 1;
          fi

      - name: Terraform apply — state backend (run.sh)
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh state init
          bash kit-modules/basis/sh/terraform.sh state apply

      - name: Terraform apply — shared network (run.sh)
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh shared init
          bash kit-modules/basis/sh/terraform.sh shared apply

      - name: Terraform apply — environment (run.sh)
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh "${EFFECTIVE_ENV_TYPE}" init
          bash kit-modules/basis/sh/terraform.sh "${EFFECTIVE_ENV_TYPE}" apply

      - name: Generate dynamic Ansible inventory from Terraform outputs
        if: steps.verify_basis.outputs.has_basis == 'true'
        working-directory: kit-modules/basis/ansible
        run: |
          IPV4=$(docker compose -f ../../../../docker-compose.toolkit.yml run --rm \
            -w "/workspace/$TF_ENV_DIR" \
            iac bash -lc "terraform output -raw instance_public_ip || true")
          IPV6=$(docker compose -f ../../../../docker-compose.toolkit.yml run --rm \
            -w "/workspace/$TF_ENV_DIR" \
            iac bash -lc "terraform output -raw instance_ipv6 || true")
          HOST_IP="${IPV6:-$IPV4}"
          if [ -z "$HOST_IP" ]; then
            echo "No instance IP found in Terraform outputs; cannot build inventory" >&2; exit 1
          fi
          printf "all:\n" > generated.inventory.yml
          printf "  vars:\n" >> generated.inventory.yml
          printf "    ansible_python_interpreter: /usr/bin/python3.11\n" >> generated.inventory.yml
          printf "  children:\n" >> generated.inventory.yml
          printf "    development:\n" >> generated.inventory.yml
          printf "      hosts:\n" >> generated.inventory.yml
          printf "        provisioned-host:\n" >> generated.inventory.yml
          printf "          ansible_host: %s\n" "${HOST_IP}" >> generated.inventory.yml
          printf "          ansible_user: admin\n" >> generated.inventory.yml
          printf "    production:\n" >> generated.inventory.yml
          printf "      hosts:\n" >> generated.inventory.yml
          printf "        provisioned-host:\n" >> generated.inventory.yml
          printf "          ansible_host: %s\n" "${HOST_IP}" >> generated.inventory.yml
          printf "          ansible_user: admin\n" >> generated.inventory.yml

      - name: Ansible playbook (provision & configure server) via compose
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          if [ ! -f "kit-modules/basis/ansible/generated.inventory.yml" ] || [ ! -f "kit-modules/basis/ansible/playbook.yml" ]; then
            echo "Dynamic inventory or playbook not found — cannot proceed." >&2; exit 1
          fi
          docker compose -f docker-compose.toolkit.yml run --rm \
            -w "/workspace/kit-modules/basis/ansible" \
            iac bash -lc "ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i generated.inventory.yml playbook.yml"



