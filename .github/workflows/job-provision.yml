name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_TYPE:
        description: 'Select target environment type'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      ACTION_TYPE:
        description: 'Select action type'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: 'plan'
      SKIP_ANSIBLE:
        description: 'Skip Ansible provisioning'
        required: false
        type: boolean
        default: false
      PLAN_RUN_ID:
        description: 'Run ID of a reviewed "plan" run to apply (leave empty for plan-then-apply)'
        required: false
        type: string
        default: ''
      CONFIRM_DESTROY:
        description: 'Required only when ACTION_TYPE is destroy — type the exact ENVIRONMENT_TYPE value to confirm'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    # Reviewer requirement (required reviewers, wait timer, etc.) is configured in
    # GitHub repo settings → Environments — not here. One dynamic expression covers dev/stage/prod.
    environment: ${{ inputs.ENVIRONMENT_TYPE }}
    concurrency:
      group: provision-${{ inputs.ENVIRONMENT_TYPE }}
      cancel-in-progress: false
    env:
      EFFECTIVE_ENV_TYPE: ${{ inputs.ENVIRONMENT_TYPE }}
      TF_ENV_DIR: kit-modules/basis/terraform/envs/${{ inputs.ENVIRONMENT_TYPE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate ENVIRONMENT_TYPE has a Terraform environment
        # Fail fast on 'stage' (no Terraform environment configured yet) before wasting any
        # AWS/SSH/composer setup time — the per-directory `[ ! -d "$TF_ENV_DIR" ]` guard later
        # in this job still runs as defense-in-depth for dev/prod.
        run: |
          case "${{ inputs.ENVIRONMENT_TYPE }}" in
            dev|prod) ;;
            *)
              echo "::error::ENVIRONMENT_TYPE '${{ inputs.ENVIRONMENT_TYPE }}' has no Terraform environment configured under kit-modules/basis/terraform/envs/. Only 'dev' and 'prod' are currently supported."
              exit 1
              ;;
          esac

      - name: Confirm destroy
        # Only applies when ACTION_TYPE == destroy — no-op for plan/apply. Must run before any
        # AWS/credential step so a missing/mismatched confirmation never gets far enough to touch
        # cloud state. The operator must type the exact ENVIRONMENT_TYPE value to confirm intent.
        if: inputs.ACTION_TYPE == 'destroy'
        run: |
          if [ "${{ inputs.CONFIRM_DESTROY }}" != "${{ inputs.ENVIRONMENT_TYPE }}" ]; then
            echo "::error::CONFIRM_DESTROY must exactly equal ENVIRONMENT_TYPE ('${{ inputs.ENVIRONMENT_TYPE }}') to proceed with a destroy. Got: '${{ inputs.CONFIRM_DESTROY }}'."
            exit 1
          fi

      - name: Extract AWS region from .env.main
        id: region
        run: |
          REGION=$(grep '^TF_VAR_aws_region=' ./config/environment/.env.main | cut -d '=' -f2)
          if [ -z "$REGION" ]; then
            echo "Error: TF_VAR_aws_region is not set in ./config/environment/.env.main"
            exit 1
          fi
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ steps.region.outputs.region }}

      - name: Configure AWS credentials (act / LocalStack)
        # Local emulation only — act auto-injects ACT=true into the job env (confirmed empirically,
        # sh/local-ci/EVIDENCE.md task 0.1). GitHub OIDC (aws-actions/configure-aws-credentials
        # above) cannot be emulated by act, so this sibling step exports the static LocalStack
        # community-tier dummy credentials instead. Inert on real GitHub runs, where ACT is unset.
        if: ${{ env.ACT }}
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=eu-west-1" >> $GITHUB_ENV

      - name: Verify AWS credentials
        run: |
          echo "AWS credentials configured via OIDC"
          echo "AWS_ACCESS_KEY_ID is set: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo "yes" || echo "no")"
          echo "AWS_SESSION_TOKEN is set: $([ -n "$AWS_SESSION_TOKEN" ] && echo "yes" || echo "no")"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Set up SSH config
        env:
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
        run: |
          if [ -z "$SSH_CONFIG" ]; then
            echo "Error: SSH_CONFIG secret is not available"
            exit 1
          fi
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_CONFIG" > ~/.ssh/config

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          if [ -n "${{ secrets.COMPOSER_AUTH }}" ]; then
            echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          fi
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Store OIDC credentials for IaC
        run: |
          # These are short-lived OIDC session credentials written only to the runner-local
          # job environment file ($GITHUB_ENV) — never persisted to the repo, the deploy
          # artifact, or the build cache. GitHub's own log masking (configured by
          # configure-aws-credentials via ::add-mask::) prevents them from leaking into logs
          # regardless of where they are read from during this job.
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Check TFPLAN_PASSPHRASE availability
        # `secrets` is not a permitted context in step `if:` expressions — resolve it into
        # a step output here so later steps can branch on it without referencing `secrets` directly.
        id: tfplan_secret
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          if [ -n "$TFPLAN_PASSPHRASE" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Basis (only in demo)
        env:
          IS_DEMO: ${{ vars.IS_DEMO }}
        run: |
          if [ "$IS_DEMO" = "true" ]; then
            echo "Detected demo mode — forcing Composer update from dist"
            export CURRENT_UID=$(id -u)
            export CURRENT_GID=$(id -g)
            source .env
            docker compose -f docker-compose.toolkit.yml run --rm \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
              -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
              -e SSH_AUTH_SOCK="$SSH_AUTH_SOCK" \
              composer su -c "
              composer update solidbunch/basis --no-interaction --with-all-dependencies
            " "${DEFAULT_USER}"
          else
            echo "Skipping composer update — not in demo mode"
          fi

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      - name: Verify Basis module is installed
        id: verify_basis
        run: |
          # Three-state classifier: composer.lock's recorded package `type` (licensed
          # `kit-module` vs unlicensed `metapackage` stub) is cross-checked against whether
          # kit-modules/basis actually landed on disk. Directory presence alone is not
          # trustworthy — see .claude/plans/architect-plan-pipeline-audit-fixes.md item 4.
          LOCK_TYPE=$(jq -r '.packages[] | select(.name=="solidbunch/basis") | .type' composer.lock)
          if [ -z "$LOCK_TYPE" ]; then
            LOCK_TYPE="metapackage"
          fi

          if [ -d "kit-modules/basis" ]; then
            DIR_PRESENT=true
          else
            DIR_PRESENT=false
          fi

          if [ "$LOCK_TYPE" = "metapackage" ] && [ "$DIR_PRESENT" = "false" ]; then
            echo "composer.lock records solidbunch/basis as unlicensed (metapackage) and kit-modules/basis is absent — genuinely unlicensed. Skipping provisioning."
            echo "has_basis=false" >> $GITHUB_OUTPUT
          elif [ "$LOCK_TYPE" = "kit-module" ] && [ "$DIR_PRESENT" = "false" ]; then
            echo "::error::composer.lock records solidbunch/basis as licensed (kit-module) but kit-modules/basis is missing on disk — install failed or the license expired. Failing the job."
            exit 1
          elif [ "$LOCK_TYPE" = "metapackage" ] && [ "$DIR_PRESENT" = "true" ]; then
            echo "::warning::composer.lock records solidbunch/basis as unlicensed (metapackage) but kit-modules/basis is present on disk — ambiguous, likely a stale or local install. Proceeding anyway."
            echo "has_basis=true" >> $GITHUB_OUTPUT
          else
            echo "Basis module found and composer.lock confirms it is licensed (kit-module)."
            echo "has_basis=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract SSH public key for Terraform
        if: steps.verify_basis.outputs.has_basis == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Guarantee cleanup of SSH key even if script fails.
          # This also deletes ~/.ssh/config written by the earlier "Set up SSH config" step,
          # not just the private key — any later step that still needs SSH config must run
          # BEFORE this step, or it will find the config gone.
          trap "rm -f ~/.ssh/id_rsa ~/.ssh/config" EXIT

          # Load environment variables
          source .env

          # Write private key to file
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Extract public key from private key using ssh-keygen -y
          ssh-keygen -y -f ~/.ssh/id_rsa > kit-modules/basis/terraform/public_keys/${TF_VAR_sk_ssh_key_name}.pub

          echo "SSH public key extracted for Terraform:"
          cat kit-modules/basis/terraform/public_keys/${TF_VAR_sk_ssh_key_name}.pub

      - name: Short-circuit when Basis is missing
        if: steps.verify_basis.outputs.has_basis == 'false'
        run: |
          echo "No license/module — skipping Terraform and Ansible."

      - name: Show provisioning plan and validate environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          echo "EFFECTIVE_ENV_TYPE=${EFFECTIVE_ENV_TYPE}"
          echo "TF_ENV_DIR=${TF_ENV_DIR}"
          if [ ! -d "$TF_ENV_DIR" ]; then
            echo "Terraform environment directory '$TF_ENV_DIR' not found" >&2; exit 1;
          fi

          # Verify AWS credentials are available in container
          echo "Verifying AWS credentials in container..."
          docker compose -f docker-compose.toolkit.yml run --rm \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
            -e SSH_AUTH_SOCK="$SSH_AUTH_SOCK" \
            iac bash -c "
            echo 'AWS_ACCESS_KEY_ID is set: \$([ -n \"\$AWS_ACCESS_KEY_ID\" ] && echo \"yes\" || echo \"no\")'
            echo 'AWS_SESSION_TOKEN is set: \$([ -n \"\$AWS_SESSION_TOKEN\" ] && echo \"yes\" || echo \"no\")'
            aws sts get-caller-identity
          "

      - name: Download reviewed plan artifact
        id: download_plan
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.PLAN_RUN_ID != '' &&
          steps.tfplan_secret.outputs.set == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ inputs.ENVIRONMENT_TYPE }}
          run-id: ${{ inputs.PLAN_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./tfplan-download

      - name: Decrypt and unpack reviewed plan
        id: decrypt_plan
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.PLAN_RUN_ID != '' &&
          steps.tfplan_secret.outputs.set == 'true' &&
          steps.download_plan.outcome == 'success'
        continue-on-error: true
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          gpg --batch --yes --decrypt --passphrase "$TFPLAN_PASSPHRASE" \
            --output tfplans.tar.gz ./tfplan-download/tfplans.tar.gz.gpg
          tar xzf tfplans.tar.gz
          rm -f tfplans.tar.gz
          {
            echo "**Plan source:** pinned plan from run \`${{ inputs.PLAN_RUN_ID }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # An explicit PLAN_RUN_ID means the operator wants a specific, already-reviewed plan
      # applied — never a silent substitute. If the artifact download or the decrypt/unpack
      # failed for a pinned run, this must stop the run loudly rather than falling through to
      # "Record plan-then-apply fallback" below, which would silently apply a fresh, unreviewed
      # plan under the same generic summary note used for "no plan was ever requested".
      - name: Fail on pinned plan retrieval failure
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.PLAN_RUN_ID != '' &&
          steps.tfplan_secret.outputs.set == 'true' &&
          (steps.download_plan.outcome == 'failure' || steps.decrypt_plan.outcome == 'failure')
        run: |
          echo "::error::Pinned Terraform plan for run '${{ inputs.PLAN_RUN_ID }}' could not be retrieved (artifact download or decrypt/unpack failed). An explicit PLAN_RUN_ID was provided, so this run is stopping instead of silently falling back to an unreviewed same-run plan-then-apply. Verify the run ID, that its 'tfplan-${{ inputs.ENVIRONMENT_TYPE }}' artifact still exists, and that TFPLAN_PASSPHRASE matches the one used to encrypt it, then re-dispatch."
          exit 1

      - name: Record plan-then-apply fallback
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          (inputs.PLAN_RUN_ID == '' || steps.tfplan_secret.outputs.set != 'true' || steps.download_plan.outcome != 'success')
        run: |
          {
            echo "**Plan source:** same-run plan-then-apply (no pinned plan used)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Terraform state backend exists
        # The S3 bucket backing Terraform state is bootstrapped once, locally, and is never
        # created by CI (see .claude/rules/ci.md, "State backend — bootstrapped once, locally,
        # never by CI"). If a project skips that one-time bootstrap, the 'shared' Terraform run
        # below fails deep inside the S3 backend init with a raw NoSuchBucket/AccessDenied error
        # that reads like a permissions problem. Check for the bucket explicitly here so the
        # failure names the actual cause and points at the fix.
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          source .env
          if ! aws s3api head-bucket --bucket "$TF_VAR_tf_backend_bucket" --region "$AWS_DEFAULT_REGION" 2>/dev/null; then
            echo "::error::Terraform state backend bucket '${TF_VAR_tf_backend_bucket}' does not exist or is not accessible. This is not an AWS permissions problem — the CI role deliberately has no s3:CreateBucket permission. The state backend must be bootstrapped once, locally, before provisioning can run. Dispatch the 'Bootstrap Terraform State Backend' workflow (job-bootstrap-state.yml) against this AWS account, then re-run this workflow."
            exit 1
          fi

      # 'shared' is the only cross-environment bulkhead CI still runs automatically — it must
      # never be destroyed as a side effect of tearing down one environment's EC2 instance. The
      # 'state' layer (backend bootstrap) is no longer run by CI at all: it is bootstrapped once,
      # locally, via `make tf state ...` — see .claude/rules/ci.md for the full procedure. Only
      # 'plan'/'apply' run 'shared'; 'destroy' skips it entirely and is scoped to the
      # 'Terraform — environment' step below. To actually destroy the shared network, run this
      # workflow with ENVIRONMENT_TYPE pointed at that layer explicitly — there is currently no
      # dedicated destroy path for 'shared'; report if one is needed.
      - name: Terraform — shared network
        if: steps.verify_basis.outputs.has_basis == 'true' && inputs.ACTION_TYPE != 'destroy'
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash kit-modules/basis/sh/terraform.sh -e shared -c init
          if [ "${{ inputs.ACTION_TYPE }}" = "plan" ]; then
            bash kit-modules/basis/sh/terraform.sh -e shared -c plan -f tfplans/shared.tfplan
          else
            if [ -f tfplans/shared.tfplan ]; then
              echo "- **shared:** applying pinned plan" >> "$GITHUB_STEP_SUMMARY"
              if ! bash kit-modules/basis/sh/terraform.sh -e shared -c apply -f tfplans/shared.tfplan; then
                echo "::error::Pinned Terraform plan for layer 'shared' was rejected (likely stale vs current remote state). Re-run 'plan', review the new plan, and re-apply with the new PLAN_RUN_ID. No auto-retry was performed."
                exit 1
              fi
            else
              echo "- **shared:** plan-then-apply (no pinned plan)" >> "$GITHUB_STEP_SUMMARY"
              bash kit-modules/basis/sh/terraform.sh -e shared -c apply
            fi
          fi

      - name: Terraform — shared skipped (destroy is scoped to the environment layer)
        if: steps.verify_basis.outputs.has_basis == 'true' && inputs.ACTION_TYPE == 'destroy'
        run: |
          echo "- **shared:** skipped — destroy only tears down the '${EFFECTIVE_ENV_TYPE}' environment layer, never the shared network" >> "$GITHUB_STEP_SUMMARY"

      # Snapshot the target layer's remote state before it is torn down. Runs only on the
      # destroy path, before the 'Terraform — environment' step below actually calls
      # `terraform destroy` — this is the only point-in-time recovery artifact a destroy run
      # leaves behind, so it must exist before the state it describes is gone.
      - name: Backup Terraform state before destroy
        if: steps.verify_basis.outputs.has_basis == 'true' && inputs.ACTION_TYPE == 'destroy'
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env

          docker compose -f docker-compose.toolkit.yml run --rm \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
            -e SSH_AUTH_SOCK="$SSH_AUTH_SOCK" \
            iac su -c "
              cd \"./$TF_ENV_DIR\" && \
              terraform init \
                -backend-config=\"bucket=\$TF_VAR_tf_backend_bucket\" \
                -backend-config=\"region=\$TF_VAR_aws_region\" \
                -backend-config=\"dynamodb_table=\$TF_VAR_tf_lock_table\" >/dev/null && \
              terraform state pull
            " "${DEFAULT_USER}" > tfstate-backup.json

          if [ ! -s tfstate-backup.json ]; then
            echo "::error::terraform state pull returned no output for layer '${EFFECTIVE_ENV_TYPE}' — aborting destroy without a state backup."
            exit 1
          fi

      # Same TFPLAN_PASSPHRASE gating already used for the pinned-plan artifact above
      # (steps.tfplan_secret, lines ~137-148): encrypt-and-upload when the secret is set,
      # loud summary warning (never a silent skip) when it is not.
      - name: Encrypt and upload Terraform state backup
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'destroy' &&
          steps.tfplan_secret.outputs.set == 'true'
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$TFPLAN_PASSPHRASE" \
            --output tfstate-backup.json.gpg tfstate-backup.json
          rm -f tfstate-backup.json

      - name: Upload encrypted Terraform state backup artifact
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'destroy' &&
          steps.tfplan_secret.outputs.set == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfstate-backup-${{ inputs.ENVIRONMENT_TYPE }}
          path: tfstate-backup.json.gpg
          retention-days: 90

      - name: Warn when Terraform state backup is skipped
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'destroy' &&
          steps.tfplan_secret.outputs.set != 'true'
        run: |
          rm -f tfstate-backup.json
          {
            echo "**Warning:** \`TFPLAN_PASSPHRASE\` secret is not configured — a pre-destroy Terraform"
            echo "state snapshot for layer \`${EFFECTIVE_ENV_TYPE}\` was captured but NOT uploaded as an"
            echo "artifact (plaintext state is never uploaded). No \`tfstate-backup-${EFFECTIVE_ENV_TYPE}\`"
            echo "artifact exists for this run — if this destroy needs to be reverted, there is no CI-side"
            echo "recovery snapshot; re-provisioning from scratch is the only path."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform — environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c init
          if [ "${{ inputs.ACTION_TYPE }}" = "plan" ]; then
            bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c plan -f "tfplans/${EFFECTIVE_ENV_TYPE}.tfplan"
          elif [ "${{ inputs.ACTION_TYPE }}" = "apply" ]; then
            if [ -f "tfplans/${EFFECTIVE_ENV_TYPE}.tfplan" ]; then
              echo "- **${EFFECTIVE_ENV_TYPE}:** applying pinned plan" >> "$GITHUB_STEP_SUMMARY"
              if ! bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c apply -f "tfplans/${EFFECTIVE_ENV_TYPE}.tfplan"; then
                echo "::error::Pinned Terraform plan for layer '${EFFECTIVE_ENV_TYPE}' was rejected (likely stale vs current remote state). Re-run 'plan', review the new plan, and re-apply with the new PLAN_RUN_ID. No auto-retry was performed."
                exit 1
              fi
            else
              echo "- **${EFFECTIVE_ENV_TYPE}:** plan-then-apply (no pinned plan)" >> "$GITHUB_STEP_SUMMARY"
              bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c apply
            fi
          else
            # Only 'destroy' reaches this branch — see the comment above the 'shared' step.
            bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c ${{ inputs.ACTION_TYPE }} -y
          fi

      - name: Package and encrypt Terraform plan
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'plan' &&
          steps.tfplan_secret.outputs.set == 'true'
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          tar czf tfplans.tar.gz tfplans/shared.tfplan "tfplans/${EFFECTIVE_ENV_TYPE}.tfplan"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$TFPLAN_PASSPHRASE" \
            --output tfplans.tar.gz.gpg tfplans.tar.gz
          rm -f tfplans.tar.gz

      - name: Upload encrypted Terraform plan artifact
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'plan' &&
          steps.tfplan_secret.outputs.set == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ inputs.ENVIRONMENT_TYPE }}
          path: tfplans.tar.gz.gpg
          retention-days: 7

      - name: Warn when plan artifact upload is skipped
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'plan' &&
          steps.tfplan_secret.outputs.set != 'true'
        run: |
          {
            echo "**Warning:** \`TFPLAN_PASSPHRASE\` secret is not configured — the reviewed Terraform"
            echo "plan was NOT uploaded as an artifact (plaintext plans are never uploaded)."
            echo "\`apply\` will fall back to today's same-run plan-then-apply behaviour."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Ansible inventory
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.SKIP_ANSIBLE == 'false'
        run: |
          bash kit-modules/basis/sh/ansible.sh -e "${{ inputs.ENVIRONMENT_TYPE }}" -a inventory

      - name: Run Ansible playbook
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.SKIP_ANSIBLE == 'false'
        run: |
          bash kit-modules/basis/sh/ansible.sh -e "${{ inputs.ENVIRONMENT_TYPE }}" -a playbook

      - name: Generate Infrastructure Summary
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply'
        run: |
          echo "## Infrastructure Provisioning Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ inputs.ACTION_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.ENVIRONMENT_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get instance details
          # Distinguish "output not set yet" (N/A) from "terraform command actually errored" (ERROR)
          get_tf_output() {
            local name="$1" out rc errfile
            errfile=$(mktemp)
            out=$(docker compose -f docker-compose.toolkit.yml run --rm \
              -w "/srv/$TF_ENV_DIR" \
              iac bash -lc "terraform output -raw $name" 2>"$errfile")
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "$out"
            elif grep -q "not found" "$errfile"; then
              echo "N/A"
            else
              echo "ERROR"
            fi
            rm -f "$errfile"
          }

          IPV4=$(get_tf_output instance_public_ip)
          IPV6=$(get_tf_output instance_ipv6)

          if [ "$IPV4" != "N/A" ] || [ "$IPV6" != "N/A" ]; then
            echo "### Instance Details" >> $GITHUB_STEP_SUMMARY
            echo "- **IPv4 Address:** $IPV4" >> $GITHUB_STEP_SUMMARY
            echo "- **IPv6 Address:** $IPV6" >> $GITHUB_STEP_SUMMARY
            echo "- **SSH Command:** ssh admin@${IPV6:-$IPV4}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify instance connectivity: \`ssh admin@${IPV6:-$IPV4}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Run deployment workflow to deploy application" >> $GITHUB_STEP_SUMMARY
          echo "3. Configure DNS records if needed" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          rm -f kit-modules/basis/ansible/generated.inventory.yml || true

