name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_TYPE:
        description: 'Select target environment type'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      ACTION_TYPE:
        description: 'Select action type'
        required: true
        type: choice
        options:
          - apply
          - plan
          - destroy
        default: 'apply'
      SKIP_ANSIBLE:
        description: 'Skip Ansible provisioning'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-24.04
    env:
      EFFECTIVE_ENV_TYPE: ${{ inputs.ENVIRONMENT_TYPE }}
      TF_ENV_DIR: kit-modules/basis/terraform/envs/${{ inputs.ENVIRONMENT_TYPE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "AWS credentials configured via OIDC"
          echo "AWS_ACCESS_KEY_ID is set: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo "yes" || echo "no")"
          echo "AWS_SESSION_TOKEN is set: $([ -n "$AWS_SESSION_TOKEN" ] && echo "yes" || echo "no")"

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          if [ -n "${{ secrets.COMPOSER_AUTH }}" ]; then
            echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          fi
          # Inject AWS credentials from OIDC into IaC container
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> ./config/environment/.env.secret
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> ./config/environment/.env.secret
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> ./config/environment/.env.secret
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> ./config/environment/.env.secret
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Update Basis (only in demo)
        env:
          IS_DEMO: ${{ secrets.IS_DEMO }}
        run: |
          if [ "$IS_DEMO" = "true" ]; then
            echo "Detected demo mode — forcing Composer update from dist"
            export CURRENT_UID=$(id -u)
            export CURRENT_GID=$(id -g)
            source .env
            docker compose -f docker-compose.toolkit.yml run --rm composer su -c "
              composer update solidbunch/basis --no-interaction --with-all-dependencies
            " "${DEFAULT_USER}"
          else
            echo "Skipping composer update — not in demo mode"
          fi

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      - name: Verify Basis module is installed
        id: verify_basis
        run: |
          if [ ! -d "kit-modules/basis" ]; then
            echo "Basis module is not installed. Skipping provisioning."
            echo "has_basis=false" >> $GITHUB_OUTPUT
          else
            echo "Basis module found."
            echo "has_basis=true" >> $GITHUB_OUTPUT
          fi

      - name: Short-circuit when Basis is missing
        if: steps.verify_basis.outputs.has_basis == 'false'
        run: |
          echo "No license/module — skipping Terraform and Ansible."

      - name: Show provisioning plan and validate environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          echo "EFFECTIVE_ENV_TYPE=${EFFECTIVE_ENV_TYPE}"
          echo "TF_ENV_DIR=${TF_ENV_DIR}"
          if [ ! -d "$TF_ENV_DIR" ]; then
            echo "Terraform environment directory '$TF_ENV_DIR' not found" >&2; exit 1;
          fi

          # Verify AWS credentials are available in container
          echo "Verifying AWS credentials in container..."
          docker compose -f docker-compose.toolkit.yml run --rm iac bash -c "
            echo 'AWS_ACCESS_KEY_ID is set: \$([ -n \"\$AWS_ACCESS_KEY_ID\" ] && echo \"yes\" || echo \"no\")'
            echo 'AWS_SESSION_TOKEN is set: \$([ -n \"\$AWS_SESSION_TOKEN\" ] && echo \"yes\" || echo \"no\")'
            aws sts get-caller-identity || echo 'AWS credentials test failed'
          "

      - name: Terraform — state backend
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh -e state -c init
          bash kit-modules/basis/sh/terraform.sh -e state -c ${{ inputs.ACTION_TYPE }}

      - name: Terraform — shared network
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh -e shared -c init
          bash kit-modules/basis/sh/terraform.sh -e shared -c ${{ inputs.ACTION_TYPE }}

      - name: Terraform — environment
        if: steps.verify_basis.outputs.has_basis == 'true'
        run: |
          bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c init
          bash kit-modules/basis/sh/terraform.sh -e "${EFFECTIVE_ENV_TYPE}" -c ${{ inputs.ACTION_TYPE }}

      - name: Generate Ansible inventory
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.SKIP_ANSIBLE == 'false'
        run: |
          bash kit-modules/basis/sh/ansible.sh -e "${{ inputs.ENVIRONMENT_TYPE }}" -a inventory

      - name: Run Ansible playbook
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply' &&
          inputs.SKIP_ANSIBLE == 'false'
        run: |
          bash kit-modules/basis/sh/ansible.sh -e "${{ inputs.ENVIRONMENT_TYPE }}" -a playbook

      - name: Generate Infrastructure Summary
        if: |
          steps.verify_basis.outputs.has_basis == 'true' &&
          inputs.ACTION_TYPE == 'apply'
        run: |
          echo "## Infrastructure Provisioning Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ inputs.ACTION_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.ENVIRONMENT_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get instance details
          IPV4=$(docker compose -f docker-compose.toolkit.yml run --rm \
            -w "/workspace/$TF_ENV_DIR" \
            iac bash -lc "terraform output -raw instance_public_ip || echo 'N/A'" 2>/dev/null || echo "N/A")
          IPV6=$(docker compose -f docker-compose.toolkit.yml run --rm \
            -w "/workspace/$TF_ENV_DIR" \
            iac bash -lc "terraform output -raw instance_ipv6 || echo 'N/A'" 2>/dev/null || echo "N/A")

          if [ "$IPV4" != "N/A" ] || [ "$IPV6" != "N/A" ]; then
            echo "### Instance Details" >> $GITHUB_STEP_SUMMARY
            echo "- **IPv4 Address:** $IPV4" >> $GITHUB_STEP_SUMMARY
            echo "- **IPv6 Address:** $IPV6" >> $GITHUB_STEP_SUMMARY
            echo "- **SSH Command:** ssh admin@${IPV6:-$IPV4}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify instance connectivity: \`ssh admin@${IPV6:-$IPV4}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Run deployment workflow to deploy application" >> $GITHUB_STEP_SUMMARY
          echo "3. Configure DNS records if needed" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          rm -f kit-modules/basis/ansible/generated.inventory.yml || true

