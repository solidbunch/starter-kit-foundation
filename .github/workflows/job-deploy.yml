name: job-deploy

on:
  workflow_call:
    secrets:
      SSH_KEY:
        required: true
      SSH_CONFIG:
        required: true
      COMPOSER_AUTH:
        required: true
    inputs:
      DEPLOYMENT_NAME:
        required: true
        type: string
      ENVIRONMENT_TYPE:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          if [ -n "${{ secrets.COMPOSER_AUTH }}" ]; then
            echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          fi
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Theme switch + demo-mode Composer extras
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          # Load environment variables from .env file
          source .env
          docker compose -f docker-compose.toolkit.yml run --rm composer su -c "sh ./sh/ci/composer-extras.sh '${{ inputs.ENVIRONMENT_TYPE }}' '${{ vars.IS_DEMO }}'" "${DEFAULT_USER}"

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      # Rationale for why this is safe: see sh/ci/scrub-secrets.sh header.
      - name: Scrub secrets before caching
        run: sh ./sh/ci/scrub-secrets.sh

      - name: Save Built job
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .
          key: build-job-${{ github.run_number }}

  deploy:
    runs-on: ubuntu-22.04

    # Scopes vars/secrets to the GitHub Environment named after the target env
    # (dev/stage/prod) — lets APP_MULTI_INSTANCE differ per environment.
    environment: ${{ inputs.ENVIRONMENT_TYPE }}

    # Mirrors job-provision.yml's concurrency pattern (job-level, keyed by the reusable job's
    # own inputs.ENVIRONMENT_TYPE — this is a workflow_call job, so there is no top-level
    # `on.workflow_dispatch`/`on.push` input to key off instead). Grouped per environment so a
    # dev deploy and a prod deploy never block each other, but two overlapping deploys to the
    # SAME environment queue instead of racing `rsync --delete-after` / `make recreate` /
    # `make core-install` against the same host and Docker project.
    # cancel-in-progress: false, same as job-provision.yml — canceling mid-rsync/mid-recreate
    # would leave the target host in a half-deployed state, which is worse than waiting.
    concurrency:
      group: deploy-${{ inputs.ENVIRONMENT_TYPE }}
      cancel-in-progress: false

    needs: [ build ]

    steps:
      - name: Use Built job
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .
          key: build-job-${{ github.run_number }}

      - name: Set up SSH key
        run: sh ./sh/ci/setup-ssh.sh
        env:
          SSH_INPUT_MODE: literal
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}

      - name: Deploy via SSH
        run: sh ./sh/ci/deploy.sh '${{ inputs.ENVIRONMENT_TYPE }}'
        env:
          APP_MULTI_INSTANCE: ${{ vars.APP_MULTI_INSTANCE }}

