name: job-deploy

on:
  workflow_call:
    secrets:
      SSH_KEY:
        required: true
      SSH_CONFIG:
        required: true
      COMPOSER_AUTH:
        required: true
      IS_DEMO:
        required: false
    inputs:
      SSH_HOST_ALIAS:
        required: true
        type: string
      DEPLOY_PATH_DESTINATION:
        required: true
        type: string
      DEPLOYMENT_NAME:
        required: true
        type: string
      ENVIRONMENT_TYPE:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          bash ./sh/env/secret-gen.sh
          echo "COMPOSER_AUTH=${{ secrets.COMPOSER_AUTH }}" >> ./config/environment/.env.secret
          bash ./sh/env/init.sh ${{ inputs.ENVIRONMENT_TYPE }}

      - name: Switch Theme Version for Dev Environment
        if: inputs.ENVIRONMENT_TYPE == 'dev'
        run: |
          echo "Switching theme to dev-develop version for dev environment"
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          # Load environment variables from .env file
          source .env
          docker compose -f docker-compose.build.yml run --rm composer su -c "composer run switch-theme-dev" "${DEFAULT_USER}"

      - name: Build Cache - restore
        id: build-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor
            web
            kit-modules
          key: build-cache-${{ inputs.ENVIRONMENT_TYPE }}-${{ inputs.SSH_HOST_ALIAS }}-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json', 'web/wp-config/**/*') }}

      - name: Update Monitoring & Addon (only in demo)
        env:
          IS_DEMO: ${{ secrets.IS_DEMO }}
        run: |
          if [ "$IS_DEMO" = "true" ]; then
            echo "Detected demo mode — forcing Composer update from dist"
            export CURRENT_UID=$(id -u)
            export CURRENT_GID=$(id -g)
            source .env

            echo "Clearing Composer cache (on host — optional)..."
            composer clear-cache || true

            echo "Running composer update (with COMPOSER_NO_CACHE=1 inside container)..."
            docker compose -f docker-compose.build.yml run --rm \
              -e COMPOSER_NO_CACHE=1 \
              composer su -c \
              "composer update solidbunch/monitoring-client solidbunch/starter-kit-addon \
              --no-interaction --with-all-dependencies" "${DEFAULT_USER}"
          else
            echo "Skipping composer update — not in demo mode"
          fi

      - name: Install Composer and Node Dependencies
        run: |
          export CURRENT_UID=$(id -u)
          export CURRENT_GID=$(id -g)
          source .env
          bash ./sh/system/install.sh yes

      - name: Build Cache - save
        if: steps.build-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor
            web
            kit-modules
          key: build-cache-${{ inputs.ENVIRONMENT_TYPE }}-${{ inputs.SSH_HOST_ALIAS }}-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json', 'web/wp-config/**/*') }}

      - name: Save Built job
        uses: actions/cache/save@v4
        with:
          path: .
          key: build-job-${{ github.run_number }}

  deploy:
    runs-on: ubuntu-22.04

    needs: [ build ]

    steps:
      - name: Use Built job
        uses: actions/cache/restore@v4
        with:
          path: .
          key: build-job-${{ github.run_number }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh/
          echo '${{ secrets.SSH_KEY }}' > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          echo '${{ secrets.SSH_CONFIG }}' > ~/.ssh/config

      - name: Deploy via SSH
        run: |
          echo "Deploying to ${{ inputs.DEPLOY_PATH_DESTINATION }}"
          ssh ${{ inputs.SSH_HOST_ALIAS }} mkdir -p ${{ inputs.DEPLOY_PATH_DESTINATION }}
          rsync -og \
            --chmod=Dug=rwx,Fug=rw \
            --checksum \
            --recursive \
            --verbose \
            --compress \
            --links \
            --delete-after \
            --exclude ".git*" \
            --exclude "*/node_modules/" \
            --exclude "backups/" \
            --exclude "**/db-*/" \
            --exclude="**/tail-db/" \
            --exclude "logs/" \
            --exclude ".env" \
            --exclude ".env.*override" \
            --exclude ".env.*secret" \
            --exclude "config/ssl/" \
            --exclude "web/wp-content/languages" \
            --exclude "web/wp-content/uploads" \
            --include "web/wp-content/cache" \
            ./ ${{ inputs.SSH_HOST_ALIAS }}:${{ inputs.DEPLOY_PATH_DESTINATION }}
          ssh ${{ inputs.SSH_HOST_ALIAS }} "
            set -e -o pipefail;
            cd ${{ inputs.DEPLOY_PATH_DESTINATION }};
            make secret;
            bash ./sh/env/init.sh '${{ inputs.ENVIRONMENT_TYPE }}';
            make ssl;
            make recreate '${{ inputs.ENVIRONMENT_TYPE }}';
            make monitoring off;
            make monitoring on;
            bash ./sh/database/check.sh;
            make core-install"

