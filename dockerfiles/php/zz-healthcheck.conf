; Overrides the [www] pool defined in php-fpm.d/www.conf (ping.path there is commented out).
; Loaded last (zz- prefix, php-fpm.conf includes php-fpm.d/*.conf in glob/alpha order) so nothing
; after it can clobber this. Used only by the Docker healthcheck (docker-compose.yml, cgi-fcgi).
[www]
ping.path = /ping
